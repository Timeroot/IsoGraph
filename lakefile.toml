name = "isograph"
defaultTargets = ["IsoGraph"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "IsoGraph"
roots = ["IsoGraph"]

# Test / benchmark driver for the canonical labelling algorithm.
[[lean_exe]]
name = "isobench"
root = "Bench"

# Benchmark driver for the graph enumerator.
[[lean_exe]]
name = "enumbench"
root = "EnumBench"

# Timing driver for the minor search.
[[lean_exe]]
name = "minorbench"
root = "MinorBench"
