name = "isograph"
defaultTargets = ["IsoGraph"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
# Lean `v4.33` made unification respect the ambient transparency.  A `CGraph` carries its vertex
# type as a field, so the vertex type of a derived graph — `Gᶜ.V`, `(G ⊕g H).V`, `G.lineGraph.V` —
# reaches the underlying one only by unfolding the operation, and every operation is a plain `def`
# (`abbrev` would cost the `implemented_by` tabulation that makes `native_decide` usable here).
# Under the new behaviour `rw` and `simp` no longer cross that boundary, which breaks a few hundred
# proofs across the library for no mathematical reason.
backward.isDefEq.respectTransparency = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "IsoGraph"
roots = ["IsoGraph"]
# The decision procedures are meant to be run, not just compiled: `native_decide` and `#eval` call
# into imported modules, and without this they go through the interpreter.  The enumeration behind
# `small_graphs` is two orders of magnitude apart between the two.
precompileModules = true

# Test / benchmark driver for the canonical labelling algorithm.
[[lean_exe]]
name = "isobench"
root = "Bench"

# Benchmark driver for the graph enumerator.
[[lean_exe]]
name = "enumbench"
root = "EnumBench"

# Timing driver for the minor search.
[[lean_exe]]
name = "minorbench"
root = "MinorBench"

# Head-to-head driver for the tabulated adjacency of `CGraph.cache`.
[[lean_exe]]
name = "cachebench"
root = "CacheBench"
